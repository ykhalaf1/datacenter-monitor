<!-- STATUS FILTER BAR -->
<div class="status-bar">
    <span>STATUS:</span>
    <button class="sfilter s-all on" data-status="all">All Projects</button>
    <button class="sfilter s-operational" data-status="Operational">● Operational</button>
    <button class="sfilter s-construction" data-status="Under Construction">▲ Under Construction</button>
    <button class="sfilter s-approved" data-status="Approved">■ Approved</button>
    <button class="sfilter s-planned" data-status="Planned">◆ Planned</button>
    <button class="sfilter s-proposed" data-status="Proposed">○ Proposed</button>
  </div>

  <!-- STAT CARDS -->
  <div class="stat-grid">
    <div class="stat">
      <div class="stat-accent" style="background:#39ff8f"></div>
      <div class="stat-label">Total Projects</div>
      <div class="stat-val" id="s-total" style="color:#39ff8f">—</div>
      <div class="stat-sub" id="s-states-sub">across all states</div>
    </div>
    <div class="stat">
      <div class="stat-accent" style="background:#00704a"></div>
      <div class="stat-label">Operational</div>
      <div class="stat-val" id="s-op" style="color:#00704a">—</div>
      <div class="stat-sub">facilities online</div>
    </div>
    <div class="stat">
      <div class="stat-accent" style="background:var(--warn)"></div>
      <div class="stat-label">Under Construction</div>
      <div class="stat-val" id="s-con" style="color:var(--warn)">—</div>
      <div class="stat-sub">active build sites</div>
    </div>
    <div class="stat">
      <div class="stat-accent" style="background:#1a6fff"></div>
      <div class="stat-label">Total Capacity</div>
      <div class="stat-val" id="s-mw" style="color:#1a6fff">—</div>
      <div class="stat-sub" id="s-mw-sub">GW planned/operational</div>
    </div>
    <div class="stat">
      <div class="stat-accent" style="background:#00c8ff"></div>
      <div class="stat-label">Total Water Usage</div>
      <div class="stat-val" id="s-water" style="color:#00c8ff">—</div>
      <div class="stat-sub" id="s-water-sub">Mgal / year (filtered)</div>
    </div>
    <div class="stat">
      <div class="stat-accent" style="background:var(--danger)"></div>
      <div class="stat-label">Total Investment</div>
      <div class="stat-val" id="s-invest" style="color:var(--danger)">—</div>
      <div class="stat-sub" id="s-invest-sub">USD billion committed</div>
    </div>
  </div>
